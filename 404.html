<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F3F0;color:#14181A;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;padding:2rem}
  h1{font-size:clamp(3rem,12vw,6rem);margin:0;letter-spacing:-.04em;font-weight:500}
  p{color:#6D7975;margin:.5rem 0 1.75rem;font-size:.9rem}
  a{display:inline-block;padding:.6rem 1.1rem;border:1px solid #1C6B58;color:#14503F;
    text-decoration:none;border-radius:3px;font-size:.8rem;letter-spacing:.04em}
  a:hover{background:#1C6B58;color:#fff}
  @media (prefers-color-scheme:dark){
    body{background:#0E1312;color:#E6ECE8} p{color:#7C8983}
    a{border-color:#5FC8A6;color:#8AD9BE} a:hover{background:#5FC8A6;color:#0E1312}
  }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>That page does not exist.</p>
    <a href="/" id="home">Back to the homepage</a>
  </div>
  <script>
    // On a project site (user.github.io/repo/) the root is one level down.
    var parts = location.pathname.split("/").filter(Boolean);
    if (location.hostname.indexOf("github.io") > -1 && parts.length > 1) {
      document.getElementById("home").href = "/" + parts[0] + "/";
    }
  </script>
</body>
</html>
